<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProgrammeOS Film</title>
<!--
  ProgrammeOS product film: frame-accurate composition.
  Every interface image comes from footage/ (real captures of the ProgrammeOS app).
  window.renderFrame(t) draws the frame at time t (seconds). ?mode=vertical selects the 30 s 9:16 cut.
  Open with a local static server rooted at programmeos-film/ and scrub with ?t=SECONDS.
-->
<style>
  @font-face { font-family: 'Inter'; font-weight: 300; src: url(fonts/Inter_300Light.ttf); }
  @font-face { font-family: 'Inter'; font-weight: 400; src: url(fonts/Inter_400Regular.ttf); }
  @font-face { font-family: 'Inter'; font-weight: 500; src: url(fonts/Inter_500Medium.ttf); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url(fonts/Inter_600SemiBold.ttf); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url(fonts/Inter_700Bold.ttf); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; color: #f5f5f7;
    -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
  #bg, #fx, #vignette, #grain { position: absolute; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  #grain { background-image: url(assets/grain.png); opacity: 0.018; }
  .scene { position: absolute; inset: 0; display: none; }
  .world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; perspective: 2600px; }
  .dev { position: absolute; transform-origin: 50% 50%; will-change: transform; }
  .dev-frame { position: absolute; inset: 0;
    background: linear-gradient(150deg, #4a4d55 0%, #24262b 22%, #1a1b1f 50%, #2c2f35 78%, #15161a 100%);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.10), inset 0 0 0 4px rgba(0,0,0,0.6), 0 60px 120px -30px rgba(0,0,0,0.85), 0 30px 60px -20px rgba(0,0,0,0.6); }
  .dev-screen { position: absolute; overflow: hidden; background: #f5f6f7; isolation: isolate; }
  .dev-layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; }
  .dev-layer img { position: absolute; left: 0; display: block; }
  .dev-island { position: absolute; background: #050505; z-index: 20; }
  .dev-glare { position: absolute; inset: -20%; z-index: 21; pointer-events: none;
    background: linear-gradient(118deg, rgba(255,255,255,0) 38%, rgba(255,255,255,0.10) 47%, rgba(255,255,255,0.04) 53%, rgba(255,255,255,0) 60%); }
  .dev-tap { position: absolute; z-index: 22; border-radius: 50%; pointer-events: none; display: none;
    background: radial-gradient(circle, rgba(88,124,250,0.30) 0%, rgba(88,124,250,0.22) 55%, rgba(88,124,250,0) 72%);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.85); }
  .crop { position: absolute; overflow: hidden; transform-origin: 50% 50%;
    box-shadow: 0 40px 90px -20px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.06); }
  .crop img { position: absolute; display: block; }
  .txt { position: absolute; white-space: nowrap; will-change: transform, opacity; }
  .w { display: inline-block; will-change: transform, opacity; }
  .eyebrow { font-weight: 600; font-size: 17px; letter-spacing: 0.22em; text-transform: uppercase; color: #93A9FF; }
  .h1 { font-weight: 600; letter-spacing: -0.035em; line-height: 1.04; color: #f5f5f7; }
  .h1.dim { color: #86868b; }
  .label { font-weight: 500; font-size: 19px; letter-spacing: 0.01em; color: #8e8e93; text-align: center; }
  .pill { font-weight: 500; font-size: 17px; color: #c9d3ff; padding: 9px 18px; border-radius: 999px;
    border: 1px solid rgba(147,169,255,0.45); background: rgba(88,124,250,0.12); }
  .frag { position: absolute; width: 400px; box-sizing: border-box; padding: 22px 24px; border-radius: 22px; display: flex; gap: 18px; align-items: center;
    background: linear-gradient(180deg, rgba(44,46,52,0.96), rgba(26,27,31,0.96)); border: 1px solid rgba(255,255,255,0.09);
    box-shadow: 0 30px 70px -10px rgba(0,0,0,0.7); transform-origin: 50% 50%; }
  .frag.note { background: linear-gradient(180deg, rgba(64,56,30,0.96), rgba(46,40,22,0.96)); border-color: rgba(217,164,65,0.25); }
  .frag-ico { flex: none; width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  .frag-ico svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .frag-title { font-weight: 500; font-size: 21px; line-height: 1.28; color: #ededf2; }
  .frag-meta { font-weight: 400; font-size: 16px; line-height: 1.3; color: #8e8e96; margin-top: 4px; }
  .frag-dot { position: absolute; top: 18px; right: 18px; width: 10px; height: 10px; border-radius: 50%; }
  .wordmark { font-weight: 700; letter-spacing: -0.02em; color: #f5f5f7; }
  .wordmark b { font-weight: 700; color: #93A9FF; }
  .sheen { color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(100deg, rgba(255,255,255,0) 42%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 58%); background-size: 300% 100%; background-repeat: no-repeat; }
  .grad { color: transparent; -webkit-background-clip: text; background-clip: text; background-image: linear-gradient(92deg, #b9c6ff 0%, #7f99fc 55%, #6f8dfb 100%); }
  svg.lines { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="scenes"></div><div id="fx"></div><div id="vignette"></div><div id="grain"></div></div>
<script src="film.js"></script>
</body>
</html>
